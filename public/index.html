<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SduSell - buy and sell in Kazakhstan</title>
  <meta name="description" content="SduSell is a classifieds marketplace for students and neighbours in Kazakhstan. Post a listing in a minute and chat with buyers by phone or WhatsApp.">
  <meta name="theme-color" content="#0C1D4D">
  <link rel="icon" href="/assets/sdusell-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#/" id="skip" data-i18n="Skip to content">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="SduSell home" data-i18n-aria-label="SduSell home">
        <img class="logo-mark" src="/assets/sdusell-mark.svg" alt="" width="40" height="40">
        <span class="logo-text">SduSell</span>
      </a>

      <form class="search" id="searchForm" role="search">
        <input type="search" id="q" name="q" placeholder="Search for your next find…" data-i18n-placeholder="Search for your next find…" aria-label="Search listings" data-i18n-aria-label="Search listings" autocomplete="off" maxlength="100">
        <button class="search-btn" type="submit" data-i18n="Search">Search</button>
      </form>

      <nav class="actions" id="actions" aria-label="Account" data-i18n-aria-label="Account"></nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><a href="#/" class="footer-logo"><img class="footer-logo-mark" src="/assets/sdusell-mark.svg" alt="" width="28" height="28">SduSell</a><p data-i18n="Independent student project.">Independent student project.</p></div>
      <p class="footer-note"><span data-i18n="A student project, made for your community.">A student project, made for your community.</span><br><span data-i18n="Meet in a public place and check the item before you pay.">Meet in a public place and check the item before you pay.</span></p>
    </div>
  </footer>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
