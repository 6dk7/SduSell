<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SduSell - buy and sell in Kazakhstan</title>
  <meta name="description" content="SduSell is a classifieds marketplace for students and neighbours in Kazakhstan. Post a listing in a minute and chat with buyers by phone or WhatsApp.">
  <meta name="theme-color" content="#0C1D4D">
  <link rel="icon" href="/assets/sdu-university.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#/" id="skip">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="SduSell home">
        <img class="sdu-logo" src="/assets/sdu-university.png" alt="SDU University" width="400" height="148">
        <span class="logo-divider" aria-hidden="true"></span>
        <span class="logo-wordmark"><span class="logo-text">SduSell</span><span class="logo-caption">Student marketplace</span></span>
      </a>

      <form class="search" id="searchForm" role="search">
        <input type="search" id="q" name="q" placeholder="Search for your next find…" aria-label="Search listings" autocomplete="off" maxlength="100">
        <button class="search-btn" type="submit">Search</button>
      </form>

      <nav class="actions" id="actions" aria-label="Account"></nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand"><img class="footer-sdu-logo" src="/assets/sdu-university.png" alt="SDU University" width="400" height="148"><a href="#/">SduSell<span aria-hidden="true">.</span></a><p>Independent student project.</p></div>
      <p class="footer-note">A student project, made for your community.<br>Meet in a public place and check the item before you pay.</p>
    </div>
  </footer>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
