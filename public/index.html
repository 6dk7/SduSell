<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SduSell - buy and sell in Kazakhstan</title>
  <meta name="description" content="SduSell is a classifieds marketplace for students and neighbours in Kazakhstan. Post a listing in a minute and chat with buyers by phone or WhatsApp.">
  <meta name="theme-color" content="#00AFCA">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FFC83D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#/" id="skip">Skip to content</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="SduSell home">
        <svg class="logo-sun" viewBox="0 0 32 32" aria-hidden="true">
          <g stroke="#FFC83D" stroke-width="2" stroke-linecap="round">
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(45 16 16)"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(90 16 16)"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(135 16 16)"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(180 16 16)"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(225 16 16)"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(270 16 16)"/>
            <line x1="16" y1="2" x2="16" y2="6" transform="rotate(315 16 16)"/>
          </g>
          <circle cx="16" cy="16" r="7" fill="#FFC83D"/>
        </svg>
        <span class="logo-text">SduSell</span>
      </a>

      <form class="search" id="searchForm" role="search">
        <input type="search" id="q" name="q" placeholder="Search bicycle, iPhone, учебник" aria-label="Search listings" autocomplete="off" maxlength="100">
        <button class="search-btn" type="submit">Search</button>
      </form>

      <nav class="actions" id="actions" aria-label="Account"></nav>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <p>SduSell is a student project. Meet in a public place and check the item before you pay.</p>
  </footer>

  <dialog id="dialog"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
